######################################################################################
#                                                                                    #
#    Конфигурация для модифицированного драйвера CH347T в режиме 3 (UART + JTAG)     #
#                                                                                    #
#    Модификацию драйвера разработал Дмитрий Снегирёв <dmitry.snegiryov@mail.ru>     #
#                                                                                    #
#    Адрес Git-репозитория проекта — https://gitflic.ru/project/rus_mcu/openocd      #
#                                                                                    #
#  !!! Для доступа к USB используется библиотека libusb, которая в Windows требует   #
#  установки соответствующего драйвера устройства. В Windows проще всего установить  #
#  драйвер libusb c помощью утилиты Zadig. Linux поддерживает libusb по умолчанию.   #
#                                                                                    #
#    Назначение выводов микросхемы CH347T для сигнальных линий интерфейса JTAG:      #
#                                                                                    #
#      TMS  —  5 (DSR0/GPIO2/SCS0/TMS)                                               #
#      TCK  —  6 (CTS0/GPIO0/SCK/TCK)                                                #
#      TDO  —  7 (RTS0/GPIO1/MISO/TDO)                                               #
#      TDI  —  8 (TXD0/MOSI/TDI)                                                     #
#      TRST —  9 (TNOW0/DTR0/GPIO5/SCS1/TRST)                                        #
#      SRST — 11 (RI0/GPIO3/SCL)                                                     #
#                                                                                    #
#  Присвоение выводу GPIO3 функции SRST позволяет всем линиям интерфейса UART1 быть  #
#  независимым и от интерфейсов JTAG с SWD, и от линии индикации подключения к USB.  #
#                                                                                    #
#    Назначение выводов микросхемы CH347T для сигнальных линий интерфейса SWD:       #
#                                                                                    #
#      SWDIO — 5 (DSR0/GPIO2/SCS0/TMS)                                               #
#      SWCLK — 6 (CTS0/GPIO0/SCK/TCK)                                                #
#                                                                                    #
#    Назначение выводов микросхемы CH347T для сигнальных линий интерфейса UART1:     #
#                                                                                    #
#      TXD  —  3 (TXD1)                                                              #
#      RXD  —  4 (RXD1)                                                              #
#      RTS  — 13 (MODE1/RTS1/GPIO7)                                                  #
#      CTS  —  2 (CTS1/GPIO6)                                                        #
#      DTR  — 10 (MODE0/TNOW1/DTR1)                                                  #
#                                                                                    #
#    Назначение вывода микросхемы CH347T для линии индикации подключения к USB:      #
#                                                                                    #
#      ACT  — 15 (GPIO4/ACT)                                                         #
#                                                                                    #
#  Единственный свободный от любых важных функций GPIO4 можно задействовать также и  #
#  для светодиодной индикации активности обмена данными с интерфейсом JTAG. Команда  #
#  "adapter gpio led 4 -active-low" делает активным сигнал низкого уровня, т.е. «0», #
#  а команда "adapter gpio led 4 -active-high" — сигнал высокого уровня, т.е. «1».   #
#                                                                                    #
#  Данная модификация драйвера даёт выбор их двух вариантов: GPIO4 и GPIO6. Но если  #
#  настроить GPIO6 как линию индикации активности JTAG, то тогда потеряется функция  #
#  сигнальной линии CTS от последовательного порта UART1, которая иногда требуется.  #
#                                                                                    #
#  !!! Внимание !!! Светодиодная индикация активности передачи JTAG-пакетов снижает  #
#  скорость обмена данными в 1,5-2 раза из-за переключения одного бита 8-разрядного  #
#  порта ввода-вывода многобайтовыми командами по USB, а не встроенными средствами.  #
#                                                                                    #
#   Остаётся неясным функционал одного свободного вывода в режиме 3 (UART + JTAG),   #
#   который по описанию должен уметь быть пином GPIO как вывод 11 (RI0/GPIO3/SCL):   #
#                                                                                    #
#    ??? — 12 (RXD0/SDA) // Есть ли функция переназначения GPIO на этот вывод ???    #
#                                                                                    #
######################################################################################

# Имя драйвера адаптера
# Применение: adapter driver <имя>
adapter driver ch347

# Идентификаторы производителя (vid) и продукта (pid) от USB-устройства CH347T
# Применение: adapter usb vid_pid <vid pid>
adapter usb vid_pid 0x1a86 0x55dd

# Доступные значения скорости интерфейса адаптера CH347T в килогерцах:
#     469 = 468,75 кГц
#     938 = 937,5 кГц
#    1875 = 1,875 МГц
#    3750 = 3,75 МГц
#    7500 = 7,5 МГц
#   15000 = 15 МГц
#   30000 = 30 МГц
#   60000 = 60 МГц
# Применение: adapter speed <скорость>
#adapter speed 1875

# Минимальная длительность (в миллисекундах) удержания сигнала nSRST (active-low system reset)
# Применение: adapter srst pulse_width <количество_миллисекунд>
#adapter srst pulse_width 1

# Время ожидания (в миллисекундах) после снятия сигнала nSRST (active-low system reset)
# перед началом новых операций с JTAG. Если на плате цепь сброса подключена к линии SRST,
# то происходит аппаратная перезагрузка, которая может занять некоторое время.
# Применение: adapter srst delay <количество_миллисекунд>
#adapter srst delay 20

# Смена режима линии SRST на 'push-pull' (действуют оба плеча порта: к питанию и к земле);
# По умолчанию включён режим 'open drain' (управление только одним плечом порта: к земле).
# Применение: ch347 srst_push_pull
#ch347 srst_push_pull

# Выбор пина GPIO и полярности светодиода индикации работы интерфейса JTAG.
# !!! Индикация активности снижает скорость обмена данных в 1,5-2 раза из-за
# вкл/выкл светодиода передачами команд через USB, а не самим чипом напрямую.
# Именно поэтому индикация активности отключена по умолчанию; 
# Выбор активного уровня: "-active-low" — низкий, "-active-high" — высокий.
# "n" — выбор номера пина GPIO (порта ввода-вывода). Доступны значения 4 и 6.
# Применение: adapter gpio led [n] <активный уровень>
#adapter gpio led 4 -active-low

# Выбор типа интерфейса JTAG (jtag) или SWD (swd)
# Применение: transport select <интерфейс>
#transport select jtag

# Минимальная длительность (в миллисекундах) удержания сигнала nTRST (active-low JTAG TAP reset)
# Применение: jtag_ntrst_assert_width <количество_миллисекунд>
#jtag_ntrst_assert_width 1

# Время ожидания (в миллисекундах) после снятия сигнала nTRST (active-low JTAG TAP reset)
# перед началом новых операций с JTAG.
# Применение: jtag_ntrst_delay <количество_миллисекунд>
#jtag_ntrst_delay 20
