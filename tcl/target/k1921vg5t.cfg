	adapter speed 100
	reset_config trst_and_srst
	set _CHIPNAME K1921VG5T
	
	jtag newtap $_CHIPNAME cpu -irlen 5 -expected-id 0xDEB14001

	set _DAPNAME $_CHIPNAME.dap
	set _TARGETNAME $_CHIPNAME.cpu

	#dap create $_DAPNAME -chain-position $_TARGETNAME
	target create $_TARGETNAME riscv -endian little -tap $_TARGETNAME -coreid 0
	
# Work-area is a space in RAM used for flash programming
if { [info exists WORKAREASIZE] } {
   set _WORKAREASIZE $WORKAREASIZE
} else {
   set _WORKAREASIZE 0x4000
}

# Скрытие несуществующих CSR-регистров
riscv hide_csrs 4-767,770-771,775-799,801-802,807-831,837-1951,1955,1957-1967,1971-2006,2008-2014,2016-2815,2823-2943,2951-3011,3016-3027,3029-3067,3079-3199,3207-3856,3861-4032,4036-4095

# Отображение нестандартных CSR-регистров, если не поддерживаются в коде OpenOCD по умолчанию
#riscv expose_csrs 2007=l1i_irq_ctrl,2015=l1d_irq_ctrl,2817=mtime,2945=mtimeh,3012=mpu_select,3013=mpu_control,3014=mpu_address,3015=mpu_mask,3028=mem_ctrl_global,3068=pwr_ctrl,3069=pwr_state,3070=cg_clkc,3071=fg_clkc,4033=mefaddr,4034=mefcmd,4035=cache_l1_descr

$_TARGETNAME configure -work-area-phys 0x20000000 -work-area-size $_WORKAREASIZE -work-area-backup 0

flash bank $_CHIPNAME.flash k1921vg5t 0x0 0 0 16 $_TARGETNAME

proc sw_reset_halt {} {
	reset halt
}
