adapter speed 100
reset_config trst_and_srst

set _CHIPNAME K1921VG1T
set _CPUTAPID 0xDEB15001

jtag newtap $_CHIPNAME cpu1 -irlen 5 -expected-id $_CPUTAPID
jtag newtap $_CHIPNAME cpu0 -irlen 5 -expected-id $_CPUTAPID

set _TARGETNAME_0 $_CHIPNAME.cpu0
set _TARGETNAME_1 $_CHIPNAME.cpu1

target create $_TARGETNAME_0 riscv -endian little -tap $_TARGETNAME_0 -coreid 0 -rtos hwthread
target create $_TARGETNAME_1 riscv -endian little -tap $_TARGETNAME_1 -coreid 1 -rtos hwthread

target smp $_TARGETNAME_0 $_TARGETNAME_1

set _WORKAREASIZE 0x8000
$_TARGETNAME_0 configure -work-area-phys 0x20000000 -work-area-size $_WORKAREASIZE -work-area-backup 0
$_TARGETNAME_1 configure -work-area-phys 0x20008000 -work-area-size $_WORKAREASIZE -work-area-backup 0

flash bank $_CHIPNAME.flash k1921vg1t 0x0 0 0 16 $_TARGETNAME_0

targets $_TARGETNAME_0

proc sw_reset_halt {} {
    reset halt
}

proc halt_all {} {
    global _TARGETNAME_0 _TARGETNAME_1
    halt
}

proc resume_all {} {
    resume
}

init
